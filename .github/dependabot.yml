version: 2
updates:
  # npm dependencies across the pnpm workspace. Minor/patch bumps are grouped into one
  # weekly PR; majors arrive individually so their migrations can be reviewed.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
