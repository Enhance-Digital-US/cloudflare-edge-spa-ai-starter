packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@google/genai': true
  '@openrouter/sdk': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  workerd: true
# Security patches for transitive dependencies whose parents pin vulnerable ranges.
# Remove each once the parent (in parentheses) ships a fixed range; `pnpm audit` verifies.
overrides:
  # GHSA-238p-pmpm-9mq7, ships to browsers (@streamdown/math → rehype-katex)
  katex: ^0.18.2
  # critical command injection, dev-only (concurrently)
  shell-quote: ^1.11.0
  # libvips/librsvg CVE, dev-only (wrangler → miniflare)
  sharp: ^0.35.5
